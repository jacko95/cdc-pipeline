AWSTemplateFormatVersion: '2010-09-09'
Description: NUREBO EC2 Ubuntu 22.04 t3.medium ASG + ALB + HTTPS

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Key pair SSH
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Seleziona 2 subnet pubbliche
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.medium, t3.large, t3.xlarge, m5.large, m5.xlarge]
  DesiredCapacity:
    Type: Number
    Default: 1
  MinSize:
    Type: Number
    Default: 1
  MaxSize:
    Type: Number
    Default: 3
  CertificateArn:
    Type: String
    Default: arn:aws:acm:eu-central-1:161741908860:certificate/35c39238-109e-4ac6-b7de-56e4aa799996
    Description: ARN certificato ACM per il tuo dominio

Resources:
  # =========================================================
  # SECURITY GROUPS
  # =========================================================
  AlbSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress HTTP HTTPS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80,   ToPort: 80,   CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443,  ToPort: 443,  CidrIp: 0.0.0.0/0 }
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0 }

  Ec2SG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EC2 ingress SSH ALB app-ports
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 22,    ToPort: 22,    CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80,    ToPort: 80,    SourceSecurityGroupId: !Ref AlbSG }
        - { IpProtocol: tcp, FromPort: 3000,  ToPort: 3000,  CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 5000,  ToPort: 5000,  CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 7077,  ToPort: 7077,  CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 8080,  ToPort: 8080,  CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 8081,  ToPort: 8081,  CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 8083,  ToPort: 8083,  CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 8085,  ToPort: 8085,  CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 8089,  ToPort: 8090,  CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 29092, ToPort: 29092, CidrIp: 0.0.0.0/0 }
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0 }

  # =========================================================
  # IAM (SSM per Session Manager)
  # =========================================================
  Ec2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref Ec2Role]

  # =========================================================
  # LAUNCH TEMPLATE
  # =========================================================
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: nurebo-lt
      LaunchTemplateData:
        ImageId: ami-0d1ddd83282187d18
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        IamInstanceProfile:
          Arn: !GetAtt Ec2InstanceProfile.Arn
        SecurityGroupIds: [!Ref Ec2SG]
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: 30
              VolumeType: gp3
        UserData:
          Fn::Base64: |
            #!/bin/bash
            set -euxo pipefail

            # Swap 4GB
            fallocate -l 4G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
            sysctl vm.swappiness=10

            # Docker
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y ca-certificates curl gnupg lsb-release

            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            chmod a+r /etc/apt/keyrings/docker.asc
            CODENAME=$(. /etc/os-release && echo $VERSION_CODENAME)
            ARCH=$(dpkg --print-architecture)
            echo "deb [arch=$ARCH signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $CODENAME stable" > /etc/apt/sources.list.d/docker.list

            apt-get update -y
            apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            systemctl enable --now docker
            usermod -aG docker ubuntu

            mkdir -p /opt/nurebo
            cd /opt/nurebo

            cat > docker-compose.yml <<'COMPOSE_EOF'
            name: nurebo

            services:
              kafka:
                image: apache/kafka:3.7.0
                container_name: kafka
                hostname: kafka
                ports: ["9092:9092", "29092:29092"]
                environment:
                  KAFKA_NODE_ID: 1
                  KAFKA_PROCESS_ROLES: broker,controller
                  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
                  KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
                  KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
                  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
                  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
                  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
                  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
                  KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
                  KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
                networks: [app-net]
                restart: unless-stopped

              mysql:
                image: mysql:8.3
                container_name: mysql
                hostname: mysql
                ports: ["3307:3306"]
                environment:
                  MYSQL_ROOT_PASSWORD: root_password
                  MYSQL_DATABASE: db_cdc
                  MYSQL_USER: cdc_user
                  MYSQL_PASSWORD: cdc_password
                command: >
                  sh -c "echo '[mysqld]\nlog_bin = mysql-bin\nserver_id = 1\nbinlog_format = ROW\ntransaction-isolation = READ-COMMITTED\nperformance_schema = OFF\ninnodb_buffer_pool_size = 128M' > /etc/mysql/conf.d/my.cnf
                  && /usr/local/bin/docker-entrypoint.sh mysqld"
                healthcheck:
                  test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
                  interval: 5s
                  timeout: 5s
                  retries: 10
                networks: [app-net]
                restart: unless-stopped

              debezium:
                image: debezium/connect:2.7.0.Final
                container_name: debezium
                hostname: debezium
                ports: ["8083:8083"]
                environment:
                  BOOTSTRAP_SERVERS: kafka:29092
                  GROUP_ID: debezium-single
                  CONFIG_STORAGE_TOPIC: debezium_configs
                  OFFSET_STORAGE_TOPIC: debezium_offsets
                  STATUS_STORAGE_TOPIC: debezium_statuses
                  CONFIG_STORAGE_REPLICATION_FACTOR: 1
                  OFFSET_STORAGE_REPLICATION_FACTOR: 1
                  STATUS_STORAGE_REPLICATION_FACTOR: 1
                  REST_ADVERTISED_HOST_NAME: debezium
                  KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
                depends_on:
                  kafka: { condition: service_started }
                  mysql: { condition: service_healthy }
                networks: [app-net]
                restart: unless-stopped

              init-connector:
                image: alpine:3.20
                container_name: init-connector
                depends_on:
                  debezium: { condition: service_started }
                command:
                  - /bin/sh
                  - -c
                  - |
                    apk add --no-cache curl mysql-client
                    until mysqladmin ping -hmysql -uroot -proot_password --silent; do echo waiting_mysql; sleep 3; done
                    mysql -hmysql -uroot -proot_password <<'SQL'
                    GRANT SELECT, RELOAD, SHOW DATABASES, REPLICATION SLAVE, REPLICATION CLIENT, LOCK TABLES ON *.* TO 'cdc_user'@'%';
                    FLUSH PRIVILEGES;
                    CREATE DATABASE IF NOT EXISTS db_cdc;
                    USE db_cdc;
                    CREATE TABLE IF NOT EXISTS utenti (
                      id INT NOT NULL AUTO_INCREMENT,
                      name VARCHAR(255),
                      PRIMARY KEY (id)
                    );
                    INSERT INTO utenti (name)
                      SELECT 'ciccio' FROM DUAL
                      WHERE NOT EXISTS (SELECT 1 FROM utenti LIMIT 1);
                    SQL
                    echo grants_and_seed_ok
                    until curl -sf http://debezium:8083/ >/dev/null; do echo waiting_debezium; sleep 5; done
                    curl -s -X DELETE http://debezium:8083/connectors/mysql-cdc || true
                    sleep 2
                    curl -sf -X POST http://debezium:8083/connectors -H "Content-Type: application/json" -d '{"name":"mysql-cdc","config":{"connector.class":"io.debezium.connector.mysql.MySqlConnector","database.hostname":"mysql","database.port":"3306","database.user":"root","database.password":"root_password","database.server.id":"1","topic.prefix":"mysql","database.include.list":"db_cdc","schema.history.internal.kafka.bootstrap.servers":"kafka:29092","schema.history.internal.kafka.topic":"schema-changes.db_cdc","snapshot.mode":"initial"}}'
                    echo connector_ok
                networks: [app-net]
                restart: "no"

              flink-jobmanager:
                image: apache/flink:1.19.0-scala_2.12-java11
                container_name: flink-jobmanager
                hostname: flink-jobmanager
                ports: ["8081:8081"]
                command: jobmanager
                environment:
                  FLINK_PROPERTIES: |
                    jobmanager.rpc.address: flink-jobmanager
                    rest.bind-address: 0.0.0.0
                    rest.port: 8081
                    jobmanager.memory.process.size: 700m
                networks: [app-net]
                restart: unless-stopped

              flink-taskmanager:
                image: apache/flink:1.19.0-scala_2.12-java11
                container_name: flink-taskmanager
                hostname: flink-taskmanager
                depends_on: [flink-jobmanager]
                command: taskmanager
                environment:
                  FLINK_PROPERTIES: |
                    jobmanager.rpc.address: flink-jobmanager
                    taskmanager.numberOfTaskSlots: 2
                    taskmanager.memory.process.size: 700m
                networks: [app-net]
                restart: unless-stopped

              cdc-pipeline:
                image: meneghin/cdc-pipeline:latest
                container_name: cdc-pipeline
                hostname: cdc-pipeline
                depends_on: [flink-jobmanager, kafka]
                entrypoint: ["/bin/bash", "-c"]
                command:
                  - |
                    i=0
                    until curl -sf http://flink-jobmanager:8081 >/dev/null 2>&1; do
                      i=$((i+1)); echo waiting_flink_$i; sleep 5
                      [ "$i" -gt 36 ] && break
                    done
                    /opt/flink/bin/flink run -m flink-jobmanager:8081 -d /opt/flink/usrlib/job.jar || \
                      java -cp /opt/flink/usrlib/job.jar:/opt/flink/lib/* KafkaToHttp
                    tail -f /dev/null
                networks: [app-net]
                restart: unless-stopped

              flask:
                image: meneghin/flask:latest
                container_name: flask
                hostname: flask
                ports: ["5000:5000"]
                environment:
                  MYSQL_HOST: mysql
                  MYSQL_PORT: 3306
                  MYSQL_DATABASE: db_cdc
                  MYSQL_USER: cdc_user
                  MYSQL_PASSWORD: cdc_password
                depends_on:
                  mysql: { condition: service_healthy }
                networks: [app-net]
                restart: unless-stopped

              fastapi:
                image: meneghin/fastapi:latest
                container_name: fastapi
                hostname: fastapi
                ports: ["3000:3000"]
                networks: [app-net]
                restart: unless-stopped

              phpmyadmin:
                image: phpmyadmin/phpmyadmin:latest
                container_name: phpmyadmin
                hostname: phpmyadmin
                ports: ["8085:80"]
                environment:
                  PMA_HOST: mysql
                  PMA_PORT: 3306
                  PMA_USER: cdc_user
                  PMA_PASSWORD: cdc_password
                  PMA_ABSOLUTE_URI: /phpmyadmin/
                depends_on:
                  mysql: { condition: service_healthy }
                networks: [app-net]
                restart: unless-stopped

              kafka-ui:
                image: provectuslabs/kafka-ui:latest
                container_name: kafka-ui
                hostname: kafka-ui
                ports: ["8080:8080"]
                environment:
                  KAFKA_CLUSTERS_0_NAME: local
                  KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
                  KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
                  KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://debezium:8083
                depends_on: [kafka, debezium]
                networks: [app-net]
                restart: unless-stopped

              spark-master:
                image: apache/spark:3.5.1
                container_name: spark-master
                hostname: spark-master
                user: root
                ports: ["7077:7077", "8089:8089"]
                command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
                environment:
                  SPARK_MASTER_HOST: spark-master
                  SPARK_MASTER_PORT: 7077
                  SPARK_MASTER_WEBUI_PORT: 8089
                  SPARK_DAEMON_MEMORY: 512m
                networks: [app-net]
                restart: unless-stopped

              spark-worker:
                image: apache/spark:3.5.1
                container_name: spark-worker
                hostname: spark-worker
                depends_on: [spark-master]
                command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
                environment:
                  SPARK_WORKER_CORES: 1
                  SPARK_WORKER_MEMORY: 1g
                  SPARK_WORKER_WEBUI_PORT: 8090
                  SPARK_DAEMON_MEMORY: 512m
                networks: [app-net]
                restart: unless-stopped

              nginx:
                image: nginx:alpine
                container_name: nginx
                ports: ["80:80"]
                volumes:
                  - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
                depends_on: [flask, fastapi, phpmyadmin, kafka-ui, flink-jobmanager, spark-master]
                networks: [app-net]
                restart: unless-stopped

            networks:
              app-net:
                driver: bridge
            COMPOSE_EOF

            cat > nginx.conf <<'NGINX_EOF'
            server {
              listen 80 default_server;
              resolver 127.0.0.11 valid=10s;

              location = / {
                return 200 "ok\n/flask /fastapi /kafka-ui /connect /phpmyadmin /flink /spark\n";
                add_header Content-Type text/plain;
              }
              location /flask/      { proxy_pass http://flask:5000/; }
              location /fastapi/    { proxy_pass http://fastapi:3000/; }
              location /connect/    { proxy_pass http://debezium:8083/; }
              location /kafka-ui/   { proxy_pass http://kafka-ui:8080/; }
              location /flink/      { proxy_pass http://flink-jobmanager:8081/; }
              location /spark/      { proxy_pass http://spark-master:8089/; }
              location = /phpmyadmin { return 301 /phpmyadmin/; }
              location /phpmyadmin/ { proxy_pass http://phpmyadmin:80/; }
            }
            NGINX_EOF

            cd /opt/nurebo
            docker compose up -d

  # =========================================================
  # ALB
  # =========================================================
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: nurebo-alb
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSG]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: nurebo-tg
      Port: 80
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref VpcId
      HealthCheckPath: /
      Matcher:
        HttpCode: 200-399

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  # =========================================================
  # AUTO SCALING GROUP
  # =========================================================
  ASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: nurebo-asg
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      VPCZoneIdentifier: !Ref SubnetIds
      DesiredCapacity: !Ref DesiredCapacity
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      TargetGroupARNs: [!Ref TargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 1800

  ScaleUpPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref ASG
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 70.0

Outputs:
  AlbDns:
    Value: !GetAtt ALB.DNSName
    Description: Punta il tuo dominio qui (CNAME), poi accedi via https://tuodominio/