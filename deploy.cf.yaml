AWSTemplateFormatVersion: '2010-09-09'
Description: NUREBO ECS Fargate. phpMyAdmin su 8085 (niente conflitto porta 80 con nginx). HTTP e HTTPS aperti.

Parameters:
  CertificateArn:
    Type: String
    Default: arn:aws:acm:eu-central-1:161741908860:certificate/e7613d6a-c902-42f7-bfc8-9fa39c081fa1
    Description: Usa un certificato ACM pubblico Amazon issued. Il Cloudflare Origin Certificate fa apparire Non sicuro in Chrome.

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  IGW:
    Type: AWS::EC2::InternetGateway

  IGWAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref IGW

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttach
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW

  Assoc1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  Assoc2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  Namespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: cdc.internal
      Vpc: !Ref VPC

  DiscPipeline:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: pipeline
      NamespaceId: !Ref Namespace
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - Type: A
            TTL: 10

  DiscGateway:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: gateway
      NamespaceId: !Ref Namespace
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - Type: A
            TTL: 10

  ALBSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8085
          ToPort: 8085
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  TasksSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  TasksSGIngressSelf:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TasksSG
      IpProtocol: -1
      SourceSecurityGroupId: !Ref TasksSG

  TasksSGIngressFromALB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TasksSG
      IpProtocol: tcp
      FromPort: 0
      ToPort: 65535
      SourceSecurityGroupId: !Ref ALBSG

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/nurebo
      RetentionInDays: 14

  ExecRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: nurebo-cluster

  PipelineTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: nurebo-pipeline
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "4096"
      Memory: "8192"
      ExecutionRoleArn: !GetAtt ExecRole.Arn
      ContainerDefinitions:

        - Name: kafka
          Image: apache/kafka:3.7.0
          Essential: true
          PortMappings:
            - ContainerPort: 29092
          Environment:
            - Name: KAFKA_NODE_ID
              Value: "1"
            - Name: KAFKA_PROCESS_ROLES
              Value: broker,controller
            - Name: KAFKA_CONTROLLER_QUORUM_VOTERS
              Value: 1@127.0.0.1:9093
            - Name: KAFKA_LISTENERS
              Value: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
            - Name: KAFKA_ADVERTISED_LISTENERS
              Value: PLAINTEXT://pipeline.cdc.internal:29092
            - Name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              Value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - Name: KAFKA_INTER_BROKER_LISTENER_NAME
              Value: PLAINTEXT
            - Name: KAFKA_CONTROLLER_LISTENER_NAMES
              Value: CONTROLLER
            - Name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              Value: "1"
            - Name: KAFKA_LOG_DIRS
              Value: /tmp/kraft-combined-logs
            - Name: KAFKA_HEAP_OPTS
              Value: -Xmx512M -Xms256M
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: kafka

        - Name: mysql
          Image: mysql:8.3
          Essential: true
          PortMappings:
            - ContainerPort: 3306
          Command:
            - --log-bin=mysql-bin
            - --server-id=1
            - --binlog-format=ROW
            - --transaction-isolation=READ-COMMITTED
            - --performance-schema=OFF
            - --innodb-buffer-pool-size=128M
          Environment:
            - Name: MYSQL_ROOT_PASSWORD
              Value: root_password
            - Name: MYSQL_DATABASE
              Value: db_cdc
            - Name: MYSQL_USER
              Value: cdc_user
            - Name: MYSQL_PASSWORD
              Value: cdc_password
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: mysql

        - Name: mysql-grant
          Image: mysql:8.3
          Essential: false
          Command:
            - /bin/sh
            - -c
            - |
              until mysqladmin ping -h127.0.0.1 -uroot -proot_password --silent; do echo waiting_mysql; sleep 3; done
              mysql -h127.0.0.1 -uroot -proot_password -e "GRANT SELECT, RELOAD, SHOW DATABASES, REPLICATION SLAVE, REPLICATION CLIENT, LOCK TABLES ON *.* TO 'cdc_user'@'%'; FLUSH PRIVILEGES; CREATE DATABASE IF NOT EXISTS db_cdc; CREATE TABLE IF NOT EXISTS db_cdc.utenti (id INT NOT NULL AUTO_INCREMENT, name VARCHAR(255), PRIMARY KEY (id)); INSERT INTO db_cdc.utenti (name) SELECT 'ciccio' FROM DUAL WHERE NOT EXISTS (SELECT 1 FROM db_cdc.utenti LIMIT 1);"
              echo grants_ok
              tail -f /dev/null
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: grant

        - Name: debezium
          Image: debezium/connect:2.7.0.Final
          Essential: false
          PortMappings:
            - ContainerPort: 8083
          Environment:
            - Name: BOOTSTRAP_SERVERS
              Value: 127.0.0.1:29092
            - Name: GROUP_ID
              Value: debezium-ecs
            - Name: CONFIG_STORAGE_TOPIC
              Value: debezium_configs
            - Name: OFFSET_STORAGE_TOPIC
              Value: debezium_offsets
            - Name: STATUS_STORAGE_TOPIC
              Value: debezium_statuses
            - Name: CONFIG_STORAGE_REPLICATION_FACTOR
              Value: "1"
            - Name: OFFSET_STORAGE_REPLICATION_FACTOR
              Value: "1"
            - Name: STATUS_STORAGE_REPLICATION_FACTOR
              Value: "1"
            - Name: REST_ADVERTISED_HOST_NAME
              Value: 127.0.0.1
            - Name: KAFKA_HEAP_OPTS
              Value: -Xmx512M -Xms256M
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: debezium

        - Name: init-connector
          Image: curlimages/curl:8.5.0
          Essential: false
          EntryPoint: ["sh", "-c"]
          Command:
            - |
              until curl -sf http://127.0.0.1:8083/ >/dev/null; do echo waiting_debezium; sleep 5; done
              curl -s -X DELETE http://127.0.0.1:8083/connectors/mysql-cdc || true
              sleep 2
              curl -sf -X POST http://127.0.0.1:8083/connectors -H "Content-Type: application/json" -d '{"name":"mysql-cdc","config":{"connector.class":"io.debezium.connector.mysql.MySqlConnector","database.hostname":"127.0.0.1","database.port":"3306","database.user":"root","database.password":"root_password","database.server.id":"1","topic.prefix":"mysql","database.include.list":"db_cdc","schema.history.internal.kafka.bootstrap.servers":"127.0.0.1:29092","schema.history.internal.kafka.topic":"schema-changes.db_cdc","snapshot.mode":"initial"}}'
              echo connector_ok
              tail -f /dev/null
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: init

        - Name: flink-jobmanager
          Image: apache/flink:1.19.0-scala_2.12-java11
          Essential: false
          PortMappings:
            - ContainerPort: 8081
          Command: ["jobmanager"]
          Environment:
            - Name: FLINK_PROPERTIES
              Value: "jobmanager.rpc.address: 127.0.0.1\nrest.bind-address: 0.0.0.0\nrest.port: 8081\njobmanager.memory.process.size: 1600m"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: flink-jm

        - Name: flink-taskmanager
          Image: apache/flink:1.19.0-scala_2.12-java11
          Essential: false
          Command: ["taskmanager"]
          Environment:
            - Name: FLINK_PROPERTIES
              Value: "jobmanager.rpc.address: 127.0.0.1\ntaskmanager.numberOfTaskSlots: 2\ntaskmanager.memory.process.size: 2048m"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: flink-tm

#        - Name: cdc-pipeline
#          Image: meneghin/cdc-pipeline:latest
        - Name: flink
          Image: meneghin/flink:latest
          Essential: false
          EntryPoint: [ "bash", "-c" ]
          Command:
            - |
              echo "127.0.0.1 kafka" >> /etc/hosts
              until getent hosts gateway.cdc.internal; do echo waiting_gateway; sleep 5; done
              GW=$(getent hosts gateway.cdc.internal | awk '{print $1; exit}')
              echo "$GW host.docker.internal" >> /etc/hosts
              until curl -sf http://127.0.0.1:8081 >/dev/null; do echo waiting_flink; sleep 5; done
              /opt/flink/bin/flink run -m 127.0.0.1:8081 -d /opt/flink/usrlib/job.jar
              tail -f /dev/null
          Environment:
            - Name: KAFKA_BOOTSTRAP_SERVERS
              Value: 127.0.0.1:29092
            - Name: FASTAPI_URL
              Value: http://gateway.cdc.internal:3000/events
            - Name: FLASK_URL
              Value: http://gateway.cdc.internal:5000/events
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: cdc

  GatewayTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: nurebo-gateway
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "2048"
      Memory: "4096"
      ExecutionRoleArn: !GetAtt ExecRole.Arn
      ContainerDefinitions:

        - Name: nginx
          Image: nginx:alpine
          Essential: true
          PortMappings:
            - ContainerPort: 80
          EntryPoint: ["sh", "-c"]
          Command:
            - |
              cat > /etc/nginx/conf.d/default.conf <<'EOF'
              resolver 169.254.169.253 valid=10s ipv6=off;
              server {
                listen 80 default_server;
                server_name _;
                location = / {
                  return 200 "ok\n/flask/events /fastapi/events /kafka-ui/ /connect/ /phpmyadmin/ /flink/ /spark/\nphpmyadmin diretto porta 8085\n";
                  add_header Content-Type text/plain;
                }
                location = /fastapi { return 301 /fastapi/; }
                location = /fastapi/ {
                  return 200 "FastAPI. POST /fastapi/events\n";
                  add_header Content-Type text/plain;
                }
                location /fastapi/ {
                  rewrite ^/fastapi/(.*)$ /$1 break;
                  proxy_pass http://127.0.0.1:3000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-Proto $scheme;
                }
                location = /flask { return 301 /flask/; }
                location = /flask/ {
                  return 200 "Flask. POST /flask/events o /flask/events\n";
                  add_header Content-Type text/plain;
                }
                location /flask/ {
                  rewrite ^/flask/(.*)$ /$1 break;
                  proxy_pass http://127.0.0.1:5000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-Proto $scheme;
                }
                location /connect/ {
                  rewrite ^/connect/(.*)$ /$1 break;
                  proxy_pass http://pipeline.cdc.internal:8083;
                  proxy_set_header Host $host;
                }
                location /kafka-ui/ {
                  proxy_pass http://127.0.0.1:8080/;
                  proxy_set_header Host $host;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                }
                location /flink/ {
                  proxy_pass http://pipeline.cdc.internal:8081/;
                  proxy_set_header Host $host;
                }
                location /spark/ {
                  proxy_pass http://127.0.0.1:8089/;
                  proxy_set_header Host $host;
                }
                location = /phpmyadmin { return 301 /phpmyadmin/; }
                location /phpmyadmin/ {
                  proxy_pass http://127.0.0.1:8085/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-Proto $scheme;
                }
              }
              EOF
              nginx -g 'daemon off;'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: nginx

        - Name: flask
          Image: meneghin/flask:latest
          Essential: false
          PortMappings:
            - ContainerPort: 5000
          Environment:
            - Name: MYSQL_HOST
              Value: pipeline.cdc.internal
            - Name: MYSQL_PORT
              Value: "3306"
            - Name: MYSQL_DATABASE
              Value: db_cdc
            - Name: MYSQL_USER
              Value: cdc_user
            - Name: MYSQL_PASSWORD
              Value: cdc_password
            - Name: PYTHONUNBUFFERED
              Value: "1"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: flask

        - Name: fastapi
          Image: meneghin/fastapi:latest
          Essential: false
          PortMappings:
            - ContainerPort: 3000
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: fastapi

        - Name: kafka-ui
          Image: provectuslabs/kafka-ui:latest
          Essential: false
          PortMappings:
            - ContainerPort: 8080
          Environment:
            - Name: KAFKA_CLUSTERS_0_NAME
              Value: local
            - Name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              Value: pipeline.cdc.internal:29092
            - Name: KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME
              Value: debezium
            - Name: KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS
              Value: http://pipeline.cdc.internal:8083
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: kafka-ui

        - Name: phpmyadmin
          Image: phpmyadmin/phpmyadmin:latest
          Essential: false
          PortMappings:
            - ContainerPort: 8085
          Environment:
            - Name: PMA_HOST
              Value: pipeline.cdc.internal
            - Name: PMA_PORT
              Value: "3306"
            - Name: PMA_USER
              Value: cdc_user
            - Name: PMA_PASSWORD
              Value: cdc_password
            - Name: PMA_ABSOLUTE_URI
              Value: http://nurebo.com:8085/
          EntryPoint: ["bash", "-c"]
          Command:
            - |
              if [ -f /etc/apache2/ports.conf ]; then
                sed -i 's/Listen 80/Listen 8085/g' /etc/apache2/ports.conf || true
                sed -i 's/:80/:8085/g' /etc/apache2/sites-enabled/000-default.conf || true
              fi
              exec /docker-entrypoint.sh apache2-foreground
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: pma

        - Name: spark-master
          Image: apache/spark:3.5.1
          Essential: false
          PortMappings:
            - ContainerPort: 7077
            - ContainerPort: 8089
          Command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
          Environment:
            - Name: SPARK_MASTER_HOST
              Value: 127.0.0.1
            - Name: SPARK_MASTER_PORT
              Value: "7077"
            - Name: SPARK_MASTER_WEBUI_PORT
              Value: "8089"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: spark-m

        - Name: spark-worker
          Image: apache/spark:3.5.1
          Essential: false
          Command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://127.0.0.1:7077"]
          Environment:
            - Name: SPARK_WORKER_WEBUI_PORT
              Value: "8090"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: spark-w

        - Name: spark-job
          Image: meneghin/spark:latest
          Essential: false
          EntryPoint: [ "bash", "-c" ]
          Command:
            - |
              mkdir -p /tmp/.ivy2
              sleep 20
              /opt/spark/bin/spark-submit \
                --master local[*] \
                --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1 \
                --conf spark.jars.ivy=/tmp/.ivy2 \
                /opt/spark-apps/kafka_to_http.py
          Environment:
            - Name: KAFKA_BOOTSTRAP_SERVERS
              Value: pipeline.cdc.internal:29092
            - Name: FLASK_URL
              Value: http://127.0.0.1:5000/events
            - Name: SPARK_MASTER
              Value: local[*]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: spark-job

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: nurebo-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSG

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: nurebo-nginx
      Port: 80
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VPC
      HealthCheckPath: /
      Matcher:
        HttpCode: 200-399

  PmaTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: nurebo-pma
      Port: 8085
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VPC
      HealthCheckPath: /
      Matcher:
        HttpCode: 200-399

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HttpsListenerSniCert:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    DependsOn: HttpsListener
    Properties:
      ListenerArn: !Ref HttpsListener
      Certificates:
        - CertificateArn: !Ref CertificateArn

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  PmaHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 8085
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref PmaTargetGroup

  PipelineService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpsListener
      - TasksSGIngressSelf
      - TasksSGIngressFromALB
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref PipelineTask
      DesiredCount: 1
      LaunchType: FARGATE
      ServiceRegistries:
        - RegistryArn: !GetAtt DiscPipeline.Arn
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
          SecurityGroups:
            - !Ref TasksSG

  GatewayService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpListener
      - HttpsListener
      - PmaHttpListener
      - PipelineService
      - TasksSGIngressSelf
      - TasksSGIngressFromALB
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref GatewayTask
      DesiredCount: 1
      LaunchType: FARGATE
      ServiceRegistries:
        - RegistryArn: !GetAtt DiscGateway.Arn
      LoadBalancers:
        - ContainerName: nginx
          ContainerPort: 80
          TargetGroupArn: !Ref TargetGroup
        - ContainerName: phpmyadmin
          ContainerPort: 8085
          TargetGroupArn: !Ref PmaTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref TasksSG

Outputs:
  AlbDns:
    Value: !GetAtt ALB.DNSName
  Home:
    Value: !Sub http://${ALB.DNSName}/
  PhpMyAdmin:
    Value: !Sub http://${ALB.DNSName}:8085/
  Logs:
    Value: !Ref LogGroup
